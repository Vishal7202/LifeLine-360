<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Registration Portal</title>
  <style>
    :root {
      --background: #1a1a2e;
      --color: #ffffff;
      --primary-color: #0f3460;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: var(--background);
      color: var(--color);
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 1rem;
    }

    .login-container {
      position: relative;
      width: 100%;
      max-width: 24rem;
    }

    .form-container {
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 36px 1px rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      backdrop-filter: blur(20px);
      padding: 2rem;
      z-index: 2;
      transition: all 0.3s ease;
    }

    form {
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    form.active {
      display: block;
      opacity: 1;
    }

    label {
      font-size: 0.9rem;
      display: block;
      margin-top: 1rem;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 0.3rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 5px;
      color: var(--color);
    }

    button {
      width: 100%;
      padding: 13px;
      background: var(--primary-color);
      color: var(--color);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      margin-top: 1.5rem;
    }

    .register-forget {
      color: #ffffff;
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .register-forget a {
      color: #ffffff;
      text-decoration: underline;
      cursor: pointer;
    }

    .circle {
      width: 8rem;
      height: 8rem;
      background: var(--primary-color);
      border-radius: 50%;
      position: absolute;
      z-index: -1;
    }

    .circle-one { top: 0; left: 0; transform: translate(-45%, -45%); }
    .circle-two { bottom: 0; right: 0; transform: translate(45%, 45%); }

    .theme-btn-container {
      position: absolute;
      left: 0;
      bottom: 2rem;
    }

    .registration-options {
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .registration-options button {
      padding: 10px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <section class="container" role="main">
    <div class="login-container" aria-label="Login and Registration Section">
      <div class="circle circle-one"></div>

      <div class="form-container">
        <h1 id="form-title">LOGIN</h1>

        <!-- LOGIN FORM -->
        <form id="login-form" class="active">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="Username" required />

          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Password" required />

          <button type="submit">Login</button>
        </form>

        <!-- REGISTRATION OPTIONS -->
        <div class="registration-options" id="registration-options">
          <button data-form="patient-form">Patient Registration</button>
          <button data-form="doctor-form">Doctor Registration</button>
          <button data-form="pharmacist-form">Pharmacist Registration</button>
          <button data-form="medical-form">Medical Registration</button>
          <button data-form="delivery-form">Deliveryman Registration</button>
        </div>

        <!-- Patient Form -->
        <form id="patient-form">
          <label for="patient-name">Full Name</label>
          <input type="text" id="patient-name" placeholder="Full Name" required />
          <label for="patient-email">Email</label>
          <input type="email" id="patient-email" placeholder="Email" required />
          <label for="patient-password">Password</label>
          <input type="password" id="patient-password" placeholder="Password" required />
          <button type="submit">Register as Patient</button>
        </form>

        <!-- Doctor Form -->
        <form id="doctor-form">
          <label for="doctor-name">Full Name</label>
          <input type="text" id="doctor-name" placeholder="Full Name" required />
          <label for="doctor-email">Email</label>
          <input type="email" id="doctor-email" placeholder="Email" required />
          <label for="doctor-license">License Number</label>
          <input type="text" id="doctor-license" placeholder="License Number" required />
          <label for="doctor-password">Password</label>
          <input type="password" id="doctor-password" placeholder="Password" required />
          <button type="submit">Register as Doctor</button>
        </form>

        <!-- Pharmacist Form -->
        <form id="pharmacist-form">
          <label for="pharmacist-name">Full Name</label>
          <input type="text" id="pharmacist-name" placeholder="Full Name" required />
          <label for="pharmacist-email">Email</label>
          <input type="email" id="pharmacist-email" placeholder="Email" required />
          <label for="pharmacist-id">Pharmacy ID</label>
          <input type="text" id="pharmacist-id" placeholder="Pharmacy ID" required />
          <label for="pharmacist-password">Password</label>
          <input type="password" id="pharmacist-password" placeholder="Password" required />
          <button type="submit">Register as Pharmacist</button>
        </form>

        <!-- Medical Form -->
        <form id="medical-form">
          <label for="medical-name">Full Name</label>
          <input type="text" id="medical-name" placeholder="Full Name" required />
          <label for="medical-email">Email</label>
          <input type="email" id="medical-email" placeholder="Email" required />
          <label for="medical-code">Hospital Code</label>
          <input type="text" id="medical-code" placeholder="Hospital Code" required />
          <label for="medical-password">Password</label>
          <input type="password" id="medical-password" placeholder="Password" required />
          <button type="submit">Register as Medical Staff</button>
        </form>

        <!-- Delivery Form -->
        <form id="delivery-form">
          <label for="delivery-name">Full Name</label>
          <input type="text" id="delivery-name" placeholder="Full Name" required />
          <label for="delivery-email">Email</label>
          <input type="email" id="delivery-email" placeholder="Email" required />
          <label for="delivery-id">Delivery ID</label>
          <input type="text" id="delivery-id" placeholder="Delivery ID" required />
          <label for="delivery-password">Password</label>
          <input type="password" id="delivery-password" placeholder="Password" required />
          <button type="submit">Register as Deliveryman</button>
        </form>

        <div class="register-forget">
          <a href="#" id="show-register">REGISTER</a>
          <a href="#">FORGOT PASSWORD</a>
        </div>
      </div>

      <div class="circle circle-two"></div>
    </div>
  </section>

  <script>
    const formTitle = document.getElementById("form-title");
    const loginForm = document.getElementById("login-form");
    const registerOptions = document.getElementById("registration-options");
    const showRegister = document.getElementById("show-register");
    const allForms = document.querySelectorAll("form");
    const roleButtons = document.querySelectorAll(".registration-options button");

    function hideAllForms() {
      allForms.forEach(form => form.classList.remove("active"));
    }

    // Show login by default
    loginForm.classList.add("active");

    showRegister.addEventListener("click", e => {
      e.preventDefault();
      hideAllForms();
      registerOptions.style.display = "flex";
      formTitle.textContent = "REGISTER";
    });

    roleButtons.forEach(button => {
      button.addEventListener("click", () => {
        const formId = button.getAttribute("data-form");
        const formToShow = document.getElementById(formId);
        hideAllForms();
        registerOptions.style.display = "none";
        formToShow.classList.add("active");
        formTitle.textContent = formToShow.querySelector("button").textContent;
      });
    });

    // Optional: handle submission (basic feedback)
    allForms.forEach(form => {
      form.addEventListener("submit", e => {
        e.preventDefault();
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        console.log("Form submitted:", data);
        alert("Form submitted successfully!");
        form.reset();
        hideAllForms();
        loginForm.classList.add("active");
        formTitle.textContent = "LOGIN";
      });
    });
  </script>
</body>
</html>
