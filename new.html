<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeLine360° Navbar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-gray-100">

<!-- Top Navbar -->
<div class="bg-gradient-to-r from-gray-900 to-blue-800 px-6 py-3 text-white">
  <div class="max-w-screen-xl mx-auto flex flex-wrap md:flex-nowrap justify-between items-center space-y-4 md:space-y-0">

    <!-- Logo -->
    <div class="flex items-center space-x-2">
      <i class="fas fa-heart-pulse text-3xl text-cyan-400"></i>
      <span class="text-2xl font-semibold">LifeLine360°</span>
    </div>

    <!-- Location + Search -->
    <div class="flex-grow max-w-2xl w-full md:mx-6">
      <div class="flex bg-white rounded-md overflow-hidden">
        <button class="text-sm text-gray-600 px-4 border-r whitespace-nowrap">
          Deliver to <span class="text-blue-600 font-semibold">110002</span> <i class="fas fa-chevron-down ml-1 text-xs"></i>
        </button>
        <input
          type="text"
          placeholder="Search for medicine & wellness products..."
          class="w-full px-4 py-2 text-black focus:outline-none"
        />
      </div>
    </div>

    <!-- Cart & Login -->
    <div class="flex items-center space-x-6">
      <div class="relative flex items-center">
        <i class="fas fa-cart-shopping text-xl"></i>
        <span class="ml-1">Cart</span>
        <span class="absolute -top-2 -right-2 text-xs bg-pink-600 text-white rounded-full px-1.5">0</span>
      </div>
      <div class="flex items-center space-x-1">
        <i class="fas fa-user-circle text-xl"></i>
        <span>Sign in / Sign</span>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Nav Icons -->
<div class="bg-gradient-to-r from-gray-900 to-blue-800 px-6 py-3 text-white">
  <div class="max-w-screen-xl mx-auto flex justify-around flex-wrap gap-6 text-center text-sm">
    
    <!-- Medicine -->
    <div class="flex flex-col items-center">
      <div class="bg-white p-3 rounded-full text-teal-500 text-xl">
        <i class="fas fa-pills"></i>
      </div>
      <span class="mt-1">Medicine</span>
    </div>

    <!-- Wellness -->
    <div class="flex flex-col items-center">
      <div class="bg-white p-3 rounded-full text-pink-500 text-xl">
        <i class="fas fa-heart"></i>
      </div>
      <span class="mt-1">Wellness</span>
    </div>

    <!-- Lab Tests -->
    <div class="flex flex-col items-center">
      <div class="bg-white p-3 rounded-full text-green-500 text-xl">
        <i class="fas fa-vials"></i>
      </div>
      <span class="mt-1">Lab Tests</span>
    </div>

    <!-- Consult Doctors -->
    <div class="flex flex-col items-center">
      <div class="bg-white p-3 rounded-full text-indigo-500 text-xl">
        <i class="fas fa-user-md"></i>
      </div>
      <span class="mt-1">Consult Doctors</span>
    </div>

    <!-- Products -->
    <div class="flex flex-col items-center">
      <div class="bg-white p-3 rounded-full text-yellow-500 text-xl">
        <i class="fas fa-box-open"></i>
      </div>
      <span class="mt-1">Products</span>
    </div>

    <!-- Health Corner -->
    <div class="flex flex-col items-center">
      <div class="bg-white p-3 rounded-full text-blue-500 text-xl">
        <i class="fas fa-bookmark"></i>
      </div>
      <span class="mt-1">Health Corner</span>
    </div>

    <!-- Need Help -->
    <div class="flex flex-col items-center">
      <div class="bg-white p-3 rounded-full text-red-500 text-xl">
        <i class="fas fa-question-circle"></i>
      </div>
      <span class="mt-1">Need Help</span>
    </div>

  </div>
</div>

</body>
</html>
